<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Profile - Common-Law Republic U.S.A.</title>
    <style>
        :root {
            --primary-dark: #000000;
            --secondary-dark: #111111;
            --tertiary-dark: #1a1a1a;
            --accent-gold: #f5d442;
            --accent-gold-hover: #ffe97f;
            --text-light: #ffffcc;
            --text-white: #fefefe;
            --border-color: #444;
            --shadow-color: rgba(255, 215, 0, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Times New Roman", Times, serif;
            background-color: var(--primary-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3, h4 { color: var(--accent-gold); margin-bottom: 1rem; }
        a { color: var(--accent-gold); text-decoration: none; transition: color 0.3s ease; }
        a:hover { color: var(--accent-gold-hover); }

        .main-header {
            background-color: var(--primary-dark);
            border-bottom: 2px solid var(--accent-gold);
        }
        .header-title { text-align: center; padding: 1rem 0; }
        .header-title h1 { font-size: 2.7rem; color: #ffffff; }

        .topnav {
            background-color: var(--secondary-dark);
            display: flex; justify-content: center; align-items: center;
            padding: 0; position: sticky; top: 0; z-index: 1000;
        }
        .dropdown { position: relative; display: inline-block; margin: 0 0.5rem; }
        .dropbtn {
            background: transparent; color: var(--accent-gold);
            padding: 0.8rem 1.2rem; font-size: 1rem; border: none;
            cursor: pointer; font-weight: bold; transition: color 0.3s ease;
        }
        .dropbtn:hover { color: var(--accent-gold-hover); }
        .dropdown-content {
            display: none; position: absolute; background-color: var(--tertiary-dark);
            min-width: 200px; box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 1; border: 1px solid var(--border-color); border-radius: 4px;
        }
        .dropdown-content a { color: var(--text-light); padding: 12px 16px; display: block; }
        .dropdown-content a:hover { background-color: var(--secondary-dark); color: var(--accent-gold); }
        .dropdown:hover .dropdown-content { display: block; }

        .main-content { max-width: 750px; margin: 0 auto; padding: 2rem 1rem; }

        /* User header card */
        .user-header {
            background-color: var(--secondary-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .user-header h2 { font-size: 1.8rem; margin: 0 0 0.3rem 0; }
        .trust-score-large {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-gold);
        }
        .trust-score-sub { color: #aaa; font-size: 0.9rem; }

        /* Trust vote widget */
        .trust-widget {
            background-color: var(--tertiary-dark);
            border: 1px solid var(--accent-gold);
            border-radius: 10px;
            padding: 1rem 1.4rem;
            margin-bottom: 1.5rem;
        }
        .trust-widget h4 { margin-bottom: 0.6rem; font-size: 1rem; }
        .trust-widget-row {
            display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
        }
        .trust-widget input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--accent-gold); }
        .trust-widget .score-display {
            font-size: 1.4rem; font-weight: bold; color: var(--accent-gold);
            min-width: 2.5rem; text-align: center;
        }
        .btn-submit-trust {
            padding: 0.45rem 1.1rem;
            background: var(--accent-gold);
            color: var(--primary-dark);
            border: none; border-radius: 6px;
            font-size: 0.95rem; font-weight: bold;
            cursor: pointer; font-family: inherit;
            transition: background 0.2s;
        }
        .btn-submit-trust:hover { background: var(--accent-gold-hover); }
        .trust-feedback { color: #5f5; font-size: 0.9rem; margin-top: 0.4rem; display: none; }

        /* Profile sections */
        .profile-section {
            background-color: var(--secondary-dark);
            margin: 1.2rem 0;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px var(--shadow-color);
        }
        .section-header {
            background-color: #333;
            color: #ffec99;
            padding: 0.6rem 1rem;
            margin: -1.5rem -1.5rem 1.5rem -1.5rem;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            border-bottom: 2px solid #ffec99;
        }
        .section-header h3 { margin: 0; font-size: 1.2rem; }

        .profile-row {
            display: flex;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .profile-row:last-child { border-bottom: none; }
        .profile-label { width: 40%; font-weight: bold; color: var(--accent-gold); }
        .profile-value { width: 60%; color: var(--text-light); }
        .profile-value.empty { color: #777; font-style: italic; }

        .tag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .tag {
            background-color: var(--tertiary-dark);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px; font-size: 0.9rem;
        }

        /* Locked section */
        .locked-section {
            display: flex; flex-direction: column; align-items: center;
            padding: 1.5rem; color: #aaa; text-align: center;
        }
        .lock-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .locked-section p { margin: 0.2rem 0; font-size: 0.95rem; }
        .locked-section .req-score { color: var(--accent-gold); font-weight: bold; }

        .loading-spinner { text-align: center; padding: 3rem; font-size: 1.2rem; }
        .error-msg { color: #f66; text-align: center; padding: 2rem; font-size: 1.1rem; }

        .back-link { margin-bottom: 1.2rem; display: inline-block; font-size: 0.95rem; }

        .main-footer {
            background-color: var(--secondary-dark);
            padding: 1rem; margin-top: 2rem;
            border-top: 2px solid var(--border-color);
            text-align: center;
        }

        @media (max-width: 600px) {
            .profile-row { flex-direction: column; }
            .profile-label, .profile-value { width: 100%; }
            .user-header { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="header-title">
            <h1><u>Common-Law Republic</u>; <u>U.S.A.</u>.</h1>
        </div>
        <nav class="topnav">
            <div class="dropdown">
                <button class="dropbtn">Home Page.</button>
                <div class="dropdown-content">
                    <a href="../index.html">Home Page.</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">Account.</button>
                <div class="dropdown-content">
                    <a href="./Login.html">Login</a>
                    <a href="./NewUsers-Registration.html">Register</a>
                    <a href="./MyProfile.html">My Profile</a>
                    <a href="./user-search.html">Find Users</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="main-content">
        <a href="./user-search.html" class="back-link">← Back to User Search</a>

        <div id="loadingState" class="loading-spinner">Loading profile...</div>
        <div id="errorState" class="error-msg" style="display:none;"></div>

        <div id="profileContent" style="display:none;">
            <!-- User header -->
            <div class="user-header">
                <div>
                    <h2 id="profileUsername"></h2>
                    <div class="trust-score-sub" id="profileVoteCount"></div>
                </div>
                <div style="text-align:right;">
                    <div class="trust-score-sub">Trust Score</div>
                    <span class="trust-score-large" id="profileTrustScore">—</span>
                    <span style="color:#aaa;"> / 100</span>
                </div>
            </div>

            <!-- Trust vote widget (hidden for own profile) -->
            <div class="trust-widget" id="trustWidget">
                <h4>Rate this user's trustworthiness:</h4>
                <div class="trust-widget-row">
                    <input type="range" min="1" max="100" value="50" id="trustRange"
                           oninput="document.getElementById('trustScoreVal').textContent=this.value">
                    <span class="score-display" id="trustScoreVal">50</span>
                    <button class="btn-submit-trust" onclick="submitTrustVote()">Submit Rating</button>
                </div>
                <div class="trust-feedback" id="trustFeedback"></div>
            </div>

            <!-- Profile sections -->
            <div id="sectionInfo"></div>
            <div id="sectionAddress"></div>
            <div id="sectionPolitical"></div>
            <div id="sectionEconomic"></div>
            <div id="sectionReligious"></div>
            <div id="sectionRaceEthnicity"></div>
        </div>
    </main>

    <footer class="main-footer">
        <p><u>Common-Law Republic, U.S.A.</u>; <u>Empowering Self-Governing Communities</u>.</p>
    </footer>

    <script>
        const API_BASE = 'http://localhost:8080/api/v1';

        function getParams() {
            return new URLSearchParams(window.location.search);
        }

        function getAuthToken() {
            return localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
        }

        function getAuthUser() {
            const raw = localStorage.getItem('authUser') || sessionStorage.getItem('authUser');
            if (!raw) return null;
            try { return JSON.parse(raw); } catch(e) { return null; }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function renderRow(label, value) {
            const isEmpty = !value || value === '' || value === 'null';
            return `<div class="profile-row">
                <span class="profile-label">${escapeHtml(label)}:</span>
                <span class="profile-value${isEmpty ? ' empty' : ''}">${isEmpty ? 'Not provided' : escapeHtml(String(value))}</span>
            </div>`;
        }

        function renderTagsRow(label, items) {
            if (!items || items.length === 0) {
                return `<div class="profile-row">
                    <span class="profile-label">${escapeHtml(label)}:</span>
                    <span class="profile-value empty">Not provided</span>
                </div>`;
            }
            const tags = items.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('');
            return `<div class="profile-row">
                <span class="profile-label">${escapeHtml(label)}:</span>
                <span class="profile-value"><div class="tag-list">${tags}</div></span>
            </div>`;
        }

        function renderSection(containerId, title, sectionData, renderDataFn) {
            const el = document.getElementById(containerId);
            if (sectionData.locked) {
                el.innerHTML = `<div class="profile-section">
                    <div class="section-header"><h3>${escapeHtml(title)}</h3></div>
                    <div class="locked-section">
                        <div class="lock-icon">🔒</div>
                        <p>Requires trust score: <span class="req-score">${sectionData.threshold} / 100</span></p>
                        <p>Your current score: <span class="req-score">${sectionData.viewer_score !== undefined ? Number(sectionData.viewer_score).toFixed(1) : '0.0'} / 100</span></p>
                    </div>
                </div>`;
            } else {
                const bodyHtml = sectionData.data ? renderDataFn(sectionData.data) : `<div class="profile-row"><span class="profile-value empty">Not provided by this user.</span></div>`;
                el.innerHTML = `<div class="profile-section">
                    <div class="section-header"><h3>${escapeHtml(title)}</h3></div>
                    ${bodyHtml}
                </div>`;
            }
        }

        let currentSubjectId = null;

        async function submitTrustVote() {
            const token = getAuthToken();
            if (!token) {
                alert('You must be logged in to submit a trust rating.');
                return;
            }
            const score = parseInt(document.getElementById('trustRange').value, 10);
            try {
                const res = await fetch(`${API_BASE}/users/${currentSubjectId}/trust`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score })
                });
                const fb = document.getElementById('trustFeedback');
                if (res.ok) {
                    fb.textContent = 'Rating submitted successfully!';
                    fb.style.color = '#5f5';
                } else {
                    const err = await res.json();
                    fb.textContent = 'Error: ' + (err.error || 'Unknown error');
                    fb.style.color = '#f66';
                }
                fb.style.display = 'block';
                setTimeout(() => { fb.style.display = 'none'; }, 3000);
            } catch(e) {
                const fb = document.getElementById('trustFeedback');
                fb.textContent = 'Network error.';
                fb.style.color = '#f66';
                fb.style.display = 'block';
            }
        }

        async function loadProfile() {
            const params = getParams();
            const userId = params.get('user_id');
            if (!userId) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').textContent = 'No user_id specified.';
                document.getElementById('errorState').style.display = 'block';
                return;
            }
            currentSubjectId = userId;

            const token = getAuthToken();
            if (!token) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').innerHTML = 'You must be <a href="./Login.html">logged in</a> to view profiles.';
                document.getElementById('errorState').style.display = 'block';
                return;
            }

            // Load public trust score first (no auth needed)
            try {
                const tsRes = await fetch(`${API_BASE}/public/users/${userId}/trust-score`);
                if (tsRes.ok) {
                    const ts = await tsRes.json();
                    document.getElementById('profileTrustScore').textContent =
                        ts.vote_count > 0 ? ts.score.toFixed(1) : '—';
                    document.getElementById('profileVoteCount').textContent =
                        ts.vote_count === 1 ? '1 rating' : ts.vote_count + ' ratings';
                }
            } catch(e) {}

            // Load full profile sections
            try {
                const res = await fetch(`${API_BASE}/users/${userId}/profile`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('errorState').textContent = err.error || 'Error loading profile.';
                    document.getElementById('errorState').style.display = 'block';
                    return;
                }

                const data = await res.json();

                // User header
                document.getElementById('profileUsername').textContent = data.user.username;
                document.title = data.user.username + ' — Common-Law Republic U.S.A.';

                // Trust score (from profile endpoint is more accurate / consistent)
                if (data.user.vote_count > 0) {
                    document.getElementById('profileTrustScore').textContent = data.user.trust_score.toFixed(1);
                    document.getElementById('profileVoteCount').textContent =
                        data.user.vote_count === 1 ? '1 rating' : data.user.vote_count + ' ratings';
                }

                // Hide trust widget on own profile
                const me = getAuthUser();
                if (me && String(me.id) === String(userId)) {
                    document.getElementById('trustWidget').style.display = 'none';
                } else {
                    // Pre-populate with existing rating if any
                    try {
                        const myVoteRes = await fetch(`${API_BASE}/users/${userId}/my-trust-vote`, {
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        if (myVoteRes.ok) {
                            const myVote = await myVoteRes.json();
                            document.getElementById('trustRange').value = myVote.score;
                            document.getElementById('trustScoreVal').textContent = myVote.score;
                        }
                    } catch(e) {}
                }

                // Render sections
                renderSection('sectionInfo', '1. Basic Personal Info & Communications', data.info, d => [
                    renderRow('Full Name', d.full_name),
                    renderRow('Gender', d.gender),
                    renderRow('Birthday', d.birthday ? formatDate(d.birthday) : ''),
                    renderRow("Mother's Maiden Name", d.mothers_maiden_name),
                    renderRow('Phone Number', d.phone_number),
                    renderTagsRow('Additional Emails', d.additional_emails),
                ].join(''));

                renderSection('sectionAddress', '2. Geographical Location & Address', data.address, d => [
                    renderRow('Street Address', [d.street_number, d.street_name].filter(Boolean).join(' ')),
                    renderRow('Address Line 2', d.address_line_2),
                    renderRow('City', d.city),
                    renderRow('State', d.state),
                    renderRow('Zip Code', d.zip_code),
                ].join(''));

                renderSection('sectionPolitical', '3. Political Parties & Activism', data.political, d =>
                    renderRow('Party Affiliation', d.party_affiliation)
                );

                renderSection('sectionEconomic', '4. Economics & Professions', data.economic, d => [
                    renderRow('For Current Political Structure', d.for_current_political_structure),
                    renderRow('For Capitalism', d.for_capitalism),
                    renderRow('For Laws', d.for_laws),
                    renderTagsRow('Goods & Services', d.goods_services),
                    renderTagsRow('Affiliations', d.affiliations),
                    renderRow('Support of Alt. Economics', d.support_of_alt_econ),
                    renderRow('Support Alt. Communities', d.support_alt_comm),
                    renderRow('Additional Notes', d.additional_text),
                ].join(''));

                renderSection('sectionReligious', '5. Religious & Spiritual Communities', data.religious, d => [
                    renderRow('Religion', d.religion),
                    renderRow('Support Level', d.supporting_religion !== null && d.supporting_religion !== undefined ? d.supporting_religion + '/10' : ''),
                    renderTagsRow('Religious Service Types', d.religious_services_types),
                ].join(''));

                renderSection('sectionRaceEthnicity', '6. DNA, Genetic & Racial Heritage', data.race_ethnicity, d =>
                    renderTagsRow('Race / Ethnicity', d.race)
                );

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('profileContent').style.display = 'block';

            } catch(e) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').textContent = 'Failed to load profile.';
                document.getElementById('errorState').style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
